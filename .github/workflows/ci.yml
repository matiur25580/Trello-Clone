name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=low
      - run: node --check server.cjs
        working-directory: backend
      - run: node --check routes/auth.js && node --check routes/kanban.js && node --check middleware/auth.js && node --check models/User.js && node --check models/Otp.js && node --check models/Board.js && node --check models/List.js && node --check models/Card.js && node --check models/RateLimit.js && node --check middleware/rateLimit.js
        working-directory: backend
      - run: npm test
        working-directory: backend
